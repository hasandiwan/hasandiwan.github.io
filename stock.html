<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Volume Bar Plot</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f5f5f5;
    }
    #chart {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .bar {
      fill: steelblue;
    }
    .bar:hover {
      fill: orange;
    }
    .axis-label {
      font-size: 12px;
    }
    .title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 20px;
      text-align: center;
    }
    .error {
      color: red;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- <div id="sym"><input><br><input type=submit></div> -->
  <div id="chart"></div>
    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js" integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A==" crossorigin="anonymous"></script>
  <script>
    $.ready(function() {
        var url = 'https://units-helper.d8u.us/stock?src=web'+$('input:not([type="submit"])').val()? '&sym='+url : '';
        // Load CSV data using d3.csv()
        d3.csv(url).then(data => {
          // Convert Volume to numbers
          data.forEach(d => {
            d.Volume = +d.Volume;
          });

      // Set dimensions
      const margin = { top: 20, right: 30, bottom: 30, left: 60 };
      const width = 900 - margin.left - margin.right;
      const height = 500 - margin.top - margin.bottom;

      // Create SVG
      const svg = d3.select('#chart')
        .append('svg')
        .attr('width', width + margin.left + margin.right)
        .attr('height', height + margin.top + margin.bottom)
        .append('g')
        .attr('transform', `translate(${margin.left},${margin.top})`);

      // Create scales
      const xScale = d3.scaleBand()
        .domain(data.map((d, i) => i))
        .range([0, width])
        .padding(0.1);

      const yScale = d3.scaleLinear()
        .domain([0, d3.max(data, d => d.Volume)])
        .range([height, 0]);

      // Create bars
      svg.selectAll('.bar')
        .data(data)
        .enter()
        .append('rect')
        .attr('class', 'bar')
        .attr('x', (d, i) => xScale(i))
        .attr('y', d => yScale(d.Volume))
        .attr('width', xScale.bandwidth())
        .attr('height', d => height - yScale(d.Volume));

      // Add X axis
      svg.append('g')
        .attr('transform', `translate(0,${height})`)
        .call(d3.axisBottom(xScale))
        .append('text')
        .attr('x', width / 2)
        .attr('y', 40)
        .attr('fill', 'black')
        .style('text-anchor', 'middle')
        .text('Record Index');

      // Add Y axis
      svg.append('g')
        .call(d3.axisLeft(yScale))
        .append('text')
        .attr('transform', 'rotate(-90)')
        .attr('y', 0 - margin.left)
        .attr('x', 0 - (height / 2))
        .attr('dy', '1em')
        .style('text-anchor', 'middle')
        .attr('fill', 'black')
        .text('Volume');

      // Add title
      d3.select('#chart')
        .insert('div', ':first-child')
        .attr('class', 'title')
        .text('Stock Volume Bar Plot');
    })
    .catch(error => {
      console.error('Error loading CSV:', error);
      d3.select('#chart')
        .append('div')
        .attr('class', 'error')
        .text('Error loading CSV data. Check console for details.');
    });
    });
  </script>
</body>
</html>
