<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Venues near you</title>
    <link href="//cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <style>
th { text-decoration: underline; }
.arrow { display: inline-block; }
.container { position: relative;}
#currentConditions { position: absolute; right: -1%; }
    </style>
  </head>
  <body data-bs-theme="dark">
    <div class="container">
    <span id="currentConditions" class="position-absolute top-0"></span>
        <p><span class="text-muted">Muted text</span> indicates the venue is reported as closed, as of <span id="time"></span> local time.</p>
        <table class="table">
            <thead>
                <tr><th>Rating color</th><th>Venue</th><th>Distance/Bearing</th><th>Address (Clickable Phone #)</th></tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
    <script src="//cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="//cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/luxon/3.4.4/luxon.min.js" integrity="sha512-dUlSLLkxslGILhPdCkALwk4szPhp3xmZIKFtlUD+O9Lslq41Aksmdt5OGqpomDoT4FsCUH70jQU8ezZHI3v1RQ==" crossorigin="anonymous"></script>
    <script>
      $(document).ready(function() {
	  $.ajaxSetup({
              timeout: 0
	  });
	  if((!("geolocation" in navigator)) || (null == navigator.geolocation)) {
              $('div.container-fluid').hide();
              $('.jumbotron').html('Sorry, you lack location support.');
	  }
	  else{
              $('.container-fluid').hide();
              navigator.geolocation.getCurrentPosition(function(position) {
		  $.getJSON('/nearme?latitude='+position.coords.latitude+'&longitude='+position.coords.longitude, function(data, ts, xhr) {
                      $('div.footer').append('Took '+data.time+' miliseconds to fetch from the backend, your location is ('+Math.round(position.coords.latitude*1000)/1000+' &deg;, '+Math.round(position.coords.longitude*1000)/1000 + '&deg;). <span class="closed"'+">Text decorated thusly</span> is used to indicate venues that are currently closed. The <span class="+'"arrow"> &uarr; </span>'+"'s direction represents the bearing from north to the relevant location.");
                      $('.jumbotron').hide();
                      html = '<table class="table"><caption>Bold text signifies a venue is open</caption><thead><tr><th>Venue</th><th>Distance from you (with bearing from north indicated by the arrow'+"'s direction)</th><th>Address<br>Phone Number (if available)</th></tr></thead><tbody>";
                      $.each(data.venues,function(k,v) {
			  html+='<tr class="';
			  if ((null!= v.isOpen) && !v.isOpen) {
                              html+= 'closed';
			  } else {
                              html+=  'open';
			  }
			  html+='"><td class="venue-name" style = "background:'+v.rating+'" title = "'+v.score+'">'+v.venue+'<sup>'+v.score+'</sup></td><td class="distanceAndBearing"><span class="arrow" style = "transform:rotate('+v.bearing+'deg);-ms-transform: rotate('+v.bearing+'deg);-webkit-transform:rotate('+v.bearing+'deg);">&uarr;</span>'+Math.round((v.distance+Number.EPSILON)*100)/100+' meters (&thickapprox;' +Math.round(3.28084*(((v.distance+Number.EPSILON)*100)/100))+' feet)</td><td class="link"><a href = "https://www.openstreetmap.org/search?whereami=1&query='+v.latitude+'%2C'+v.longitude+'#map=15/'+v.latitude+'/'+v.longitude+'" target = "_blank">'+v.streetAddress+'</a>';
			  if(null!= v.phoneNumber) {
                              html += '<br><a href = "tel:'+v.phoneNumber+'">'+v.phoneNumber+'</a>';
			  }
			  html+='</td></tr>';
                      });
                      html = html + '</tbody></table><p><small class="text-muted">Page loaded in '+data.time+' miliseconds</small></p>';
                      $('div.container-fluid').html(html);
                      $('.container-fluid').show();
		  }) ,function(err) {
		      if (err.code  ==  err.PERMISSION_DENIED) {
			  $('.jumbotron').html('<span>Location access denied</span>').addClass('alert alert-danger').show();
			  $('.container-fluid').hide();
		      }
		  }
              })
	  }
      });
    </script>
  </body>
</html>
