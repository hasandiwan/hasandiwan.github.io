<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Venues near you</title>
    <link href="//cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <style>
th { text-decoration: underline; }
.arrow { display: inline-block; }
.container { position: relative;}
#currentConditions { position: absolute; right: -1%; }
    </style>
  </head>
  <body data-bs-theme="dark">
    <div class="container">
    <span id="currentConditions" class="position-absolute top-0"></span>
    <p><span class="text-muted">Muted text</span> indicates the venue is reported as closed; <strong>bold text</strong> indicates the venue is open<br> as of <span id="time"></span> local time;.</p>
    
        <table class="table">
            <thead>
                <tr><th>Rating color</th><th>Venue</th><th>Distance/Bearing</th><th>Address (Clickable Phone #)</th></tr>
            </thead>
            <tbody>
	      <tr></tr>
            </tbody>
        </table>
    </div>
    <script src="//cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="//cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/luxon/3.4.4/luxon.min.js" integrity="sha512-dUlSLLkxslGILhPdCkALwk4szPhp3xmZIKFtlUD+O9Lslq41Aksmdt5OGqpomDoT4FsCUH70jQU8ezZHI3v1RQ==" crossorigin="anonymous"></script>
    <script>
      $(document).ready(function() {
	  $.ajaxSetup({
              timeout: 0
	  });
	  if((!("geolocation" in navigator)) || (null == navigator.geolocation)) {
              $('div.container-fluid').hide();
              $('.jumbotron').html('Sorry, you lack location support.');
	  }
	  else{
              $('.container').hide();
              navigator.geolocation.getCurrentPosition(function(position) {
		  $('.progress').show()
		  $.getJSON('//units.d8u.us/nearme', {latitude: position.coords.latitude, longitude: position.coords.longitude}, function(data) {
		      weatherParams={zip: position.coords.latitude+','+position.coords.longitude}
		      $.getJSON('//units.d8u.us/weather', weatherParams, function(resp) {
			  $('span#currentConditions').html('<img src="'+resp.conditions+'"/>') // TODO add text with this.conditions
			  $('#currentConditions > img:nth-child(1)').css('width', '18px').css('aspect-ratio', '1/1')
		      });
                      $('div.footer').append('Took '+data.time+' miliseconds to fetch from the backend, your location is ('+Math.round(position.coords.latitude*1000)/1000+' &deg;, '+Math.round(position.coords.longitude*1000)/1000 + '&deg;). <span class="closed"'+">Text decorated thusly</span> is used to indicate venues that are currently closed. The <span class="+'"arrow"> &#8593; </span>'+"'s direction represents the bearing from north to the relevant location.");
                      $('.jumbotron').hide();
                      $.each(data.venues,function(k,v) {
			  $('tbody').append($('tr').css({'filter': 'grayscale('+v.rating+')','-webkit-filter': 'grayscale('+v.rating+'%)'}).append($('td').attr('style', 'filter: grayscale('+v.score+')').attr('title', v.score)).append($('td').addClass('venue-name').html(v.venue+$('sup').text(v.score))).append($('td').addClass('distanceAndBearing').append($('td > span').addClass('arrow').css('transform', 'rotate('+v.bearing+'deg)').html('&#8593;')).after(Math.round(v.distance+Number.EPSILON)*100)/100+' meters (&thickapprox;'+ Math.round(3.28084*(((v.distance+Number.EPSILON)*100)/100))+' ft').append($('td').addClass("link").text($('a').attr('href', 'https://osmap.asia/#17/'+v.latitude+'/'+v.longitude).attr('target', '_blank')).text(v.streetAddress)))
			  if ((null!= v.isOpen) && !v.isOpen) {
                              $('tr:last').attr('class', 'closed');
			  } else {
                              $('tr:last').attr('class', 'open');
			  }
			  if(null!= v.phoneNumber) {
			      $('td:last').text($('td:last').text() + '<br><a href = "tel:'+v.phoneNumber+'">'+v.phoneNumber+'</a>');
			  }
		      });
		      $('.footer').html('<p><small class="text-muted">Page loaded in '+data.time+' miliseconds</small></p>')
                      $('.container').show();
		      $('#time').text(luxon.DateTime.now())
		      $('.progress').hide()
		  }) ,function(err) {
		      if (err.code  ==  err.PERMISSION_DENIED) {
			  $('.jumbotron').html('<span>Location access denied</span>').addClass('alert alert-danger').show();
			  $('.container-fluid').hide();
		      }
		  }
              })
	  }
      });
    </script>
  </body>
</html>
